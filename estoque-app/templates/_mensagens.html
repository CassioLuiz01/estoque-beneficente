{% with mensagens = get_flashed_messages() %}
{% if mensagens %}
<div role="alert" style="position:fixed;top:0;left:0;right:0;z-index:10;background:#fff3cd;color:#664d03;padding:12px 16px;text-align:center;">
    {% for mensagem in mensagens %}<p style="margin:0;">{{ mensagem }}</p>{% endfor %}
</div>
{% endif %}
{% endwith %}
